<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חידון יום ההולדת של שי-לי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #fdf2f8 0%, #f5f3ff 100%);
            height: 100vh;
            margin: 0;
            position: relative;
        }
        
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-color: #fce7f3;
            background-image: 
                radial-gradient(at 0% 0%, hsla(328,100%,90%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(272,100%,90%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(192,100%,90%,1) 0, transparent 50%);
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5vh;
            opacity: 0;
            visibility: hidden;
            z-index: 10;
        }
        .slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 20;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .option-btn {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid transparent;
        }
        .option-btn:hover {
            transform: translateY(-5px);
            background: white;
            border-color: #d946ef;
            box-shadow: 0 10px 20px rgba(217, 70, 239, 0.2);
        }

        .feedback-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
        }

        .correct-answer {
            background-color: #4ade80 !important;
            border-color: #22c55e !important;
            color: white !important;
        }
        .wrong-answer {
            background-color: #fb7185 !important;
            border-color: #f43f5e !important;
            color: white !important;
        }

        .timer-container-inline {
            width: 100%;
            max-width: 600px;
            height: 28px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 99px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.8);
            margin: 0.5rem auto;
            position: relative;
        }
        .timer-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0000, #00ff00);
            background-size: 200% 100%;
        }
        .timer-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-weight: 800;
            color: #1f2937;
            font-size: 1rem;
            line-height: 24px;
            z-index: 10;
        }

        .spawned-gift {
            position: absolute;
            pointer-events: none;
            font-size: 4rem;
            user-select: none;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
            will-change: transform;
            z-index: 5;
        }

        .gift-btn {
            background: white;
            padding: 1.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-size: 3.5rem;
            transition: all 0.2s;
            line-height: 1;
            z-index: 60;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>

    <div id="feedback" class="feedback-overlay">
        <div id="feedback-content" class="text-white text-center p-12 rounded-[3rem] transform scale-50 opacity-0 shadow-2xl">
            <div id="feedback-icon" class="text-9xl mb-4"></div>
            <div id="feedback-text" class="text-5xl font-black"></div>
        </div>
    </div>

    <!-- Intro Slide -->
    <div class="slide active" id="slide-intro">
        <div class="glass-card p-12 text-center max-w-2xl mx-4 mt-20">
            <div class="mb-6 text-9xl animate-bounce">🎂</div>
            <h1 class="text-5xl md:text-7xl font-black mb-4 text-purple-600">חידון יום הולדת שי-לי!</h1>
            <p class="text-xl md:text-2xl mb-8 text-gray-600">בואו נראה כמה אתם מכירים את אמא הכי טובה בעולם!</p>
            <button onclick="nextSlide()" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-12 py-5 rounded-full text-3xl font-bold shadow-lg hover:shadow-pink-300 transition-all transform hover:scale-110">
                מתחילים! 🎉
            </button>
        </div>
    </div>

    <!-- Quiz Content Container -->
    <div id="quiz-container"></div>

    <!-- Success Slide -->
    <div class="slide" id="slide-end">
        <div id="end-card" class="glass-card p-10 text-center max-w-4xl mx-4 mt-10 z-50 overflow-hidden">
            <div class="relative z-50">
                <div class="text-8xl mb-4">👑</div>
                <h1 class="text-5xl font-black mb-2 text-pink-600">אלופים! סיימתם את החידון בהצלחה</h1>
                <h2 class="text-3xl font-bold mb-4 text-purple-700">מזל טוב לאמא שי-לי שלנו</h2>
                <p class="text-2xl mb-8 text-gray-700 font-bold">אוהבים אותך הכי הרבה בעולם ❤️</p>
                
                <div class="flex flex-wrap justify-center gap-6 mb-10">
                    <button onclick="spawnGift('❤️')" class="gift-btn">❤️</button>
                    <button onclick="spawnGift('🎂')" class="gift-btn">🎂</button>
                    <button onclick="spawnGift('🎁')" class="gift-btn">🎁</button>
                    <button onclick="spawnGift('💋')" class="gift-btn">💋</button>
                </div>

                <button onclick="location.reload()" class="bg-purple-600 text-white px-8 py-3 rounded-2xl text-lg font-bold hover:bg-purple-700 transition-colors">
                    לשחק שוב? 🔄
                </button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { question: "בת כמה אמא?", correct: "37", options: ["30", "27", "45", "37"], image: "photo1.png" },
            { question: "איזה תספורת הייתה לאמא כאשר הייתה ילדה?", correct: "פטריה", options: ["תלתלים", "קארה", "מקורזל", "פטריה"], image: "photo2.png" },
            { question: "מה היה שם המשפחה של אמא לפני החתונה?", correct: "טיבלום", options: ["קטוב", "לוי", "כהן", "טיבלום"], image: "photo3.png" },
            { question: "איך קוראים לבית הספר שאמא עובדת בו?", correct: "שיקמים", options: ["נגבה", "עדיני", "אמירים", "שיקמים"], image: "photo4.png" },
            { question: "איך קוראים לאמא של אמא שי-לי?", correct: "מיכל", options: ["אתי", "רבקה", "חנה", "מיכל"], image: "photo5.png" },
            { question: "איך קוראים לאבא של אמא?", correct: "צחי", options: ["שאול", "שבי", "רפי", "צחי"], image: "photo6.png" },
            { question: "מה אמא הכי אוהבת בעולם?", correct: "את אריאל, רום, גוגי ואבא", options: ["שוקולד", "לישון", "לטייל", "את אריאל, רום, גוגי ואבא"], image: "photo7.png" },
            { question: "באיזה תחום אמא הייתה אלופת ישראל?", correct: "התעמלות", options: ["כדורגל", "ריקוד", "הכנת כדורי שוקולד", "התעמלות"], image: "photo8.png" },
            { question: "איפה גרו אמא ואבא לפני באר יעקב?", correct: "בעליית גג אצל סבא צחי וסבתא מימי", options: ["אצל סבא שאול", "באוהל", "בבית מלון", "בעליית גג אצל סבא צחי וסבתא מימי"], image: "photo9.png" },
            { question: "באיזה ארץ אמא הייתה גרה פעם?", correct: "צרפת", options: ["אמריקה", "ארגנטינה", "ברזיל", "צרפת"], image: "photo10.png" },
            { question: "מי בתמונה?", correct: "אמא שי-לי", options: ["אמא שי-לי", "גוגי", "אריאל", "רום"], image: "photo11.png" }
        ];

        let currentSlideIndex = -1;
        let isProcessing = false;
        let timerTween = null;
        const TIME_LIMIT = 60;

        function init() {
            const container = document.getElementById('quiz-container');
            questions.forEach((q, idx) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.id = `question-${idx}`;
                const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

                slide.innerHTML = `
                    <div class="text-center w-full max-w-2xl px-4">
                        <span class="inline-block bg-pink-100 text-pink-600 px-4 py-1 rounded-full text-sm font-bold mb-2">שאלה ${idx + 1} מתוך ${questions.length}</span>
                        <h2 class="text-3xl md:text-5xl font-extrabold text-purple-800 mb-2">${q.question}</h2>
                        <div class="timer-container-inline">
                            <div id="timer-text-${idx}" class="timer-text">${TIME_LIMIT} שניות</div>
                            <div id="timer-progress-${idx}" class="timer-bar"></div>
                        </div>
                    </div>
                    <div class="w-full max-w-5xl px-4 grid grid-cols-1 lg:grid-cols-2 gap-8 items-center mt-4">
                        <div class="glass-card h-[24rem] md:h-[30rem] flex items-center justify-center text-gray-400 overflow-hidden relative border-4 border-white/50">
                             <img src="${q.image}" alt="${q.question}" class="h-full w-auto object-contain mx-auto" onerror="this.style.display='none';">
                        </div>
                        <div class="grid grid-cols-1 gap-4">
                            ${shuffledOptions.map(opt => `
                                <button onclick="handleAnswer(this, '${opt.replace(/'/g, "\\'")}', '${q.correct.replace(/'/g, "\\'")}')" 
                                        class="option-btn text-right p-5 rounded-2xl text-xl font-bold text-gray-700 shadow-sm">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(slide);
            });
        }

        function spawnGift(emoji) {
            const card = document.getElementById('end-card');
            const gift = document.createElement('div');
            gift.className = 'spawned-gift';
            gift.innerText = emoji;
            card.appendChild(gift);

            const cardRect = card.getBoundingClientRect();
            const padding = 60;
            const randomX = padding + Math.random() * (cardRect.width - padding * 2);
            const randomY = padding + Math.random() * (cardRect.height - padding * 2);
            const randomScale = 0.7 + Math.random() * 1.3;
            const randomRotation = Math.random() * 360;

            gsap.set(gift, { 
                left: randomX, 
                top: randomY, 
                scale: 0, 
                rotation: randomRotation,
                opacity: 0,
                xPercent: -50,
                yPercent: -50
            });
            
            gsap.to(gift, { scale: randomScale, opacity: 0.5, duration: 0.5, ease: "back.out(2)" });
        }

        function startTimer(idx) {
            if (timerTween) timerTween.kill();
            const bar = document.getElementById(`timer-progress-${idx}`);
            const text = document.getElementById(`timer-text-${idx}`);
            if (!bar) return;
            
            gsap.set(bar, { width: "0%" });
            let timeData = { seconds: TIME_LIMIT };
            
            timerTween = gsap.to(bar, {
                width: "100%",
                duration: TIME_LIMIT,
                ease: "none",
                onUpdate: function() {
                    let remaining = Math.ceil(TIME_LIMIT - (this.progress() * TIME_LIMIT));
                    text.innerText = `${remaining} שניות`;
                },
                onComplete: handleTimeOut
            });
        }

        function stopTimer() {
            if (timerTween) timerTween.kill();
        }

        function handleTimeOut() {
            if (isProcessing) return;
            isProcessing = true;
            const fbContent = document.getElementById('feedback-content');
            const fbIcon = document.getElementById('feedback-icon');
            const fbText = document.getElementById('feedback-text');
            fbIcon.innerText = '⏰';
            fbText.innerText = 'נגמר הזמן!';
            fbContent.className = 'text-white text-center p-12 rounded-[3rem] transform scale-50 opacity-0 shadow-2xl bg-orange-500';
            showFeedback();
            setTimeout(() => { hideFeedback(() => { isProcessing = false; nextSlide(); }); }, 1500);
        }

        function showSlide(index) {
            const prevSlide = document.querySelector('.slide.active');
            let target;
            stopTimer();
            if (index === -1) target = document.getElementById('slide-intro');
            else if (index >= questions.length) target = document.getElementById('slide-end');
            else {
                target = document.getElementById(`question-${index}`);
                startTimer(index);
            }
            if (prevSlide) {
                gsap.to(prevSlide, { opacity: 0, y: 50, duration: 0.4, onComplete: () => prevSlide.classList.remove('active') });
            }
            target.classList.add('active');
            gsap.fromTo(target, { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: 0.6, delay: 0.2 });
            if (index >= questions.length) {
                setTimeout(() => {
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                }, 500);
            }
        }

        function nextSlide() {
            currentSlideIndex++;
            showSlide(currentSlideIndex);
        }

        function handleAnswer(btn, selected, correct) {
            if (isProcessing) return;
            isProcessing = true;
            stopTimer();
            const fbContent = document.getElementById('feedback-content');
            const fbIcon = document.getElementById('feedback-icon');
            const fbText = document.getElementById('feedback-text');

            if (selected === correct) {
                btn.classList.add('correct-answer');
                fbIcon.innerText = '⭐';
                fbText.innerText = 'מצוין!';
                fbContent.className = 'text-white text-center p-12 rounded-[3rem] transform scale-50 opacity-0 shadow-2xl bg-green-500';
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.7 } });
                setTimeout(() => {
                    showFeedback();
                    setTimeout(() => { hideFeedback(() => { isProcessing = false; nextSlide(); }); }, 1000);
                }, 300);
            } else {
                btn.classList.add('wrong-answer');
                gsap.to(btn, { x: 10, repeat: 5, yoyo: true, duration: 0.05 });
                fbIcon.innerText = '🌈';
                fbText.innerText = 'כמעט! נסו שוב';
                fbContent.className = 'text-white text-center p-12 rounded-[3rem] transform scale-50 opacity-0 shadow-2xl bg-rose-500';
                setTimeout(() => {
                    showFeedback();
                    setTimeout(() => { hideFeedback(() => { btn.classList.remove('wrong-answer'); isProcessing = false; startTimer(currentSlideIndex); }); }, 1200);
                }, 300);
            }
        }

        function showFeedback() {
            document.getElementById('feedback').style.display = 'flex';
            gsap.fromTo("#feedback-content", { scale: 0.2, opacity: 0, rotation: -15 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.7)" });
        }

        function hideFeedback(callback) {
            gsap.to("#feedback-content", { scale: 0, opacity: 0, duration: 0.3, onComplete: () => {
                document.getElementById('feedback').style.display = 'none';
                if (callback) callback();
            }});
        }

        window.onload = init;
    </script>
</body>
</html>
